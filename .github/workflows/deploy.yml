name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # PR でも push でも走る品質ゲート。vitest は hard gate ──
  # 通信 API の静的アサート(privacy.test.ts)もここに含まれるので、
  # 「画像は端末から出ません」の一段目が毎コミット検証される。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build を先に走らせる。privacy.test.ts は dist/ の中身を静的検査するので、
      # 成果物が無い状態では意味のある判定ができない ── そして「dist が無いから skip」は
      # 「常に緑」という最悪の失敗モードなので、あちらは skip せず落ちるようにしてある。
      - run: npm run build
      - run: npm test
      # 歯の確認（Phase 1c で仕組みにした）。
      #
      # `npm test` は「テストが緑か」しか見ない。**緑には 2 種類ある** ──
      # 守っているから緑なのと、何も守っていないから緑なのと。後者は
      # 予算を緩く書いたときと、テストが恒等な変換に潰れたときに生まれ、
      # 人間には見えない（緩い方向に外しても誰も落ちない）。
      # `npm run teeth` は台帳の変異を 1 つずつ入れて「本当に落ちるか」を確かめる。
      # 落ちなくなった歯があれば CI が赤くなる。
      #
      # PR で走らせる価値がある: §7.1 の `reconstructMean` も §7.7 の `fillRatios` も、
      # これが在れば発見が何フェーズも早かった。
      - run: npm run teeth
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # デプロイは main への push のときだけ。PR ではゲートまでで止める。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
