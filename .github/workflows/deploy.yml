name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# **main は run ごとに分ける／PR ブランチは ref ごとに分ける**（Phase 2c-ix で実測）。
#
# ## 一段目（2c-viii）—— ref が入っていなかった
#
# もとは `group: pages` で、**ref が入っていなかった** ── 全 run が 1 つのグループを
# 共有するので、**別のブランチを push しただけで走行中の run が cancel される。**
# 実測: #37 の run（22:20:13 開始）は `npm run teeth` の途中 22:25:01 に落ち、
# #38 の run が始まったのは **22:24:48** ── 13 秒後に消された。
# 履歴では **2c-vii でも 2 本が cancelled のまま**だった（31529963065 / 31530207696）。
#
# **これは「赤いが中身が無い」である。** `gh pr checks` は `fail` と表示するが
# conclusion は `cancelled` で、**ゲートは走っていない**。テストが落ちたのと
# 見分けがつかない形で、`npm run teeth`（7〜20 分）が丸ごと飛ぶ。
#
# ## 二段目（2c-ix）—— ref を入れても、同じ ref への連続マージは覆えていなかった
#
# `pages-${{ github.ref }}` が塞いだのは**別ブランチ**からの cancel だけである。
# §8 の運用は「1 フェーズ = 実装 PR + 文書 PR」なので **毎フェーズ main へ 2 本続けて
# マージする** ── ref はどちらも `refs/heads/main` で、**2 本目が 1 本目の main run を消す。**
# 実測: run 31694020549（`7d51c96`）は build / gecko / deploy とも **開始 39 秒で
# cancelled**（build は通常 21 分）── ゲートは 1 つも走っていない。
# **同じ型が、PR 側ではなく main 側で出た。**
#
# ## 待たせる形では塞げない
#
# `cancel-in-progress: false` にして 2 本目を待たせる案は**穴が残る**。GitHub は
# 「同じグループの `pending` は新しい run に席を譲って cancel される」と明記していて、
# これは **`cancel-in-progress` の値に依らない**（workflow-syntax）── 3 本目が来た
# 時点で同じ `cancelled` が生まれる。しかも 2 本目のゲートが 21 分待たされる。
#
# **main で消すべき run はそもそも無い。** だから鍵に SHA を入れて**同居させない** ──
# main の run は互いに触れないので、cancel も待ちも起きない。
# PR ブランチは従来どおり ref だけで、push のたびに古い run を消す（ここでは
# 消すのが正しい ── 同じブランチの古い commit を検査し続ける意味は無い）。
#
# Pages の直列は失われるので、`deploy` のジョブ側の鍵へ移した（下）。
concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # PR でも push でも走る品質ゲート。vitest は hard gate ──
  # 通信 API の静的アサート(privacy.test.ts)もここに含まれるので、
  # 「画像は端末から出ません」の一段目が毎コミット検証される。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build を先に走らせる。privacy.test.ts は dist/ の中身を静的検査するので、
      # 成果物が無い状態では意味のある判定ができない ── そして「dist が無いから skip」は
      # 「常に緑」という最悪の失敗モードなので、あちらは skip せず落ちるようにしてある。
      - run: npm run build
      - run: npm test
      # 忠実性ラダーの **構造回帰だけ**（Phase 2a で足した）。
      #
      # ## なぜ `--structural` なのか —— CI に ΔE00 を置くと「緑だが中身が無い」になる
      #
      # runner に GPU は無いので、ここで走るのは **SwiftShader** である。実測（同じページ・
      # 同じ手順）で `dimLevel = 0` の峰は SwiftShader **133** / ANGLE Metal **129**、
      # ΔE00 にして 3.18 と 4.70 ── **予算 3.5 を置けばソフトウェア経路は緑で、
      # 出荷経路は赤**という状態が作れてしまう。だから ΔE00 の判定はローカルの実 GPU で行い、
      # CI が見るのは**ラスタライザに依らない行**だけにする:
      # 起動・読み戻しの自己検査・HDR 自己検査・コンソールエラー 0・
      # そして **CPU で決まるアンカーの `Object.is` 一致**。
      #
      # ローカルで SwiftShader を強制して先に確かめてある（`--use-angle=swiftshader`）──
      # 痕跡は 5 つとも ok、アンカーは厳密一致、コンソールエラー 0。
      # **憶測で足していない。**
      #
      # そして `glInfo()` の UNMASKED_RENDERER がログに出るので、
      # **この実行自身が「CI が何で描いているか」を答える**。
      - run: npm run ladder -- --structural
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 歯の確認（Phase 1c で仕組みにした。**2c-ix の続きで分割した**）。
  #
  # `npm test` は「テストが緑か」しか見ない。**緑には 2 種類ある** ──
  # 守っているから緑なのと、何も守っていないから緑なのと。後者は
  # 予算を緩く書いたときと、テストが恒等な変換に潰れたときに生まれ、
  # 人間には見えない（緩い方向に外しても誰も落ちない）。
  # `npm run teeth` は台帳の変異を 1 つずつ入れて「本当に落ちるか」を確かめる。
  # 落ちなくなった歯があれば CI が赤くなる。
  #
  # PR で走らせる価値がある: §7.1 の `reconstructMean` も §7.7 の `fillRatios` も、
  # これが在れば発見が何フェーズも早かった。
  #
  # ## なぜ `build` から出して分割したか —— 費用の 96% がここだった
  #
  # 実測（run 31707649305・CI のステップ別）: `teeth` **1290 秒 ＝ 21 分 30 秒**に対し、
  # `build` ジョブ全体は 1341 秒 ── **96%** がここである（`npm test` 24 秒 /
  # `ladder --structural` 13 秒 / `npm ci` 4 秒 / `npm run build` 4 秒）。
  # 判定は 1 本ごとにフルスイートなので、費用は **素の状態 1 回 ＋ 変異 57 回
  # ＝ 58 回 × 22.2 秒**。歯が増えるとそのまま伸びる。
  #
  # **変異どうしは独立**なので runner を分ければ短くなる（3 分割で 19 本ずつ）。
  # **判定の意味は変えていない** ── 各変異は今までどおりフルスイートで判定される。
  #
  # `build` と混ぜたままでは分割できない: `npm run build` / `npm test` /
  # `ladder` が 3 回ずつ走り、**`upload-pages-artifact` は同じ名前を 3 回上げて衝突する**。
  #
  # ## 分割数は matrix の長さから導く（二重管理にしない）
  #
  # 分母に `strategy.job-total`（＝ matrix の要素数）を使う。`[1, 2, 3]` を `[1, 2]` に
  # 変えても分母が自動で追随するので、**「matrix を減らしたのに分母が古いままで
  # 3 本目が誰にも回らない」が起こらない**。`[1, 3]` のような穴あきにすると
  # `--shard 3/2` になり、`teeth.mjs` が範囲外として落とす。
  #
  # dist が要る（`privacy.test.ts` が読む）ので、各シャードで `npm run build` を先に走らせる。
  teeth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run teeth -- --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # **ひとつ前の main run が cancelled なら赤くする**（Phase 2c-ix の続き）。
  #
  # ## なぜ要るか —— 「消されないはず」を人が毎フェーズ確かめる形は規律である
  #
  # 上の `concurrency` で main の run は互いを消さないようにした。しかし**それが効いて
  # いることを毎フェーズ人が `gh run list` で見る**運用は、§7.10 が「規律を 9 つ書いても
  # 止まらない」と記録している型そのものになる。→ **次の run に前の run を見張らせる。**
  #
  # ## 1 段だけ遡れば足りる
  #
  # run が消されるとき、**消した側の run が必ずその直後に居る**。だから直後の run に
  # 1 つ前を見せれば取り逃がさない。基準日や基準 run id の**リテラルが要らず**、
  # 過去の cancelled（31694020549 / 31530207696 / 31512519511）にも当たらない。
  #
  # ## 実測で確かめた（憶測で足していない）
  #
  # 同じ判定式を実 API に通してある:
  #   - 現在地 31701186834（いまの main）→ 直前は 31699212208 / success → **緑**
  #   - 現在地 31694063986（**2c-ix の事故の直後の run**）→ 直前は 31694020549 /
  #     `7d51c96` / cancelled → **赤**
  # つまり**実際に起きた事故を再生して、この機構が捕まえることを確認済み**である。
  #
  # `build` を待たない（`needs` 無し）。見ているのは**履歴**であってこの run の中身では
  # ないので、22 分待つ理由が無い ── 消されたことは即座に分かるほうがよい。
  #
  # 人が意図して cancel したときもここは赤くなる。**それでよい** ── 意図の有無に依らず、
  # そのコミットは「ゲートの走っていない main run」を持つからである（§0 の「赤いが
  # 中身が無い」は、意図ではなく状態の話である）。
  history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&event=push&per_page=30" \
            --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID)] | max_by(.id)
                  | if . == null then \"none\" else \"\(.id) \(.head_sha[0:7]) \(.conclusion)\" end")"
          echo "ひとつ前の main run: $prev"
          case "$prev" in
            *cancelled)
              printf '%s\n' \
                '## ひとつ前の main run が cancelled です' \
                '' \
                "    $prev" \
                '' \
                'その run ではゲート（test / teeth / ladder --structural / gecko）が走っていません。' \
                'main の run を互いに消させないための concurrency の分離が効いていない可能性があります。' \
                '' \
                '確認: gh run view <上の run id> --json jobs' \
                '' \
                '人が意図して cancel した場合もここは赤くなります。その場合は、そのコミットを' \
                '検査した run が別に在るかを確かめてください。' \
                >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          # `"…（$prev）。"` と**隣接して書いてはいけない**（実測で踏んだ）。
          # `）` は U+FF09 = `EF BC 89` で、bash は先頭バイト `EF` を変数名の一部として
          # 食べる ── `$prev` が「未定義変数 `prev\xEF`」になって空に潰れ、残り 2 バイトが
          # 不正な UTF-8 として出る。zsh は多バイト境界を正しく扱うので**手元では再現せず、
          # CI（bash）でだけ文字化けする**。値は必ず `%s` へ渡す。
          printf 'ひとつ前の main run は cancelled ではない: %s\n' "$prev" >> "$GITHUB_STEP_SUMMARY"

  # Gecko（Firefox）の EXIF 向き判定を 1 回測る（Phase 2a で足した）。
  #
  # SPEC §4.12 の最後の空欄がこれで、1c は「**測れないのではなく入れていない**。
  # A に上げる手段は probe を 1 回開くことだけ」と書いた。ローカルへ Firefox は入れない
  # 方針なので、**runner イメージに入っている実物**（ubuntu-24.04 の Mozilla Firefox）で開く。
  #
  # **build とは別ジョブにする。** これは品質ゲートではなく**測定**であって、
  # 落ちたときに意味するのは「LENS が壊れた」ではなく「測れなかった」である。
  # 混ぜると、測定の失敗がデプロイを止めるか、ゲートの失敗が測定として読まれる。
  #
  # 終了コードの規約:
  #   0 = `applied` または `not-applied`（**どちらも測定の成功**）
  #   1 = `unknown`（probe が壊れているか Firefox が動いていない ＝ 測れていない）
  # `not-applied` が返ったら設計判断が要る ── それはスクリプトではなく人が決める（§4.12）。
  gecko:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: firefox --version
      - run: npm run gecko

  # 「この run の commit が、いま main の tip か」を **build のあとに 1 回**訊く
  # （Phase 2c-ix で足した）。
  #
  # ## なぜ要るか —— 直列にするだけでは「古いほうが後に着く」を防げない
  #
  # `concurrency` を run ごとに分けた結果、main へ続けてマージした 2 本は**並走する**。
  # 下の `pages-deploy` は同時に走らないことしか保証しないので、**先に鍵を取ったほうが
  # 後に公開されると、サイトは古いコミットを配る**。2 本の間隔は 36 秒（2c-ix の実測）で、
  # build は 21 分 ── runner の揺らぎのほうが 36 秒より大きくなりうる。
  #
  # ## これで順序は保証される（「たぶん揃う」ではない）
  #
  # 照会はゲート（`build` と `teeth`）の**あと**に置く。A が tip を名乗れるのは B がまだ
  # マージされていないときだけで、そのとき B の run は存在しない。B がマージ済みなら
  # A の照会は tip = B を返して A は公開しない ── **A が B を上書きする経路が無い。**
  # 中間コミットを配らないのは意図どおりである（配る意味が無い）。
  #
  # **この保証は所要時間に依存しない。** 2c-ix の続きで `teeth` を 3 分割して
  # 21 分 → 8 分前後に縮めたが、上の論法は「B がマージ済みか」だけを使っており、
  # ゲートが何分かかるかを一切使っていない。
  #
  # **build に混ぜない。** これはゲートではなく**公開の可否**であって、混ぜると
  # `gecko` を分けたのと同じ理由（§ジョブ分割）で読めなくなる ── 別ジョブなら
  # `gh run view` に **`deploy: skipped`** と出て、「走って落ちた」とも「消された」とも
  # 区別がつく。
  #
  # `gh api` が失敗したら**赤くする**（既定の `bash -e`）。「訊けなかったから公開しない」は
  # 緑のまま何もしない最悪の失敗モードなので、そちらへは倒さない。
  tip:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, teeth]
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.ask.outputs.current }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "この run の \`$GITHUB_SHA\` が main の tip —— **公開する**。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "main の tip は \`$tip\` で、この run は \`$GITHUB_SHA\` —— **公開しない**（古い成果物で新しいのを上書きしないため）。ゲートはこの run で走っている。" >> "$GITHUB_STEP_SUMMARY"
          fi

  # デプロイは main への push のときだけ。PR ではゲートまでで止める。
  #
  # **Pages のデプロイだけは直列に保つ。** 上の `concurrency` を run ごとに分けたので、
  # workflow の鍵はもう main の 2 本を直列にしない ── だから鍵をここへ置く。
  # GitHub の Pages スターターワークフローは `group: "pages"` /
  # **`cancel-in-progress: false`** を「同時デプロイは 1 本」「**走行中の本番デプロイは
  # 中断しない**」と明記しており、それに合わせる（走行中を消す形は、Pages 側に
  # 中途半端なデプロイを残しうる）。
  #
  # `pages-deploy` は ref を含まない ── PR では `deploy` が走らないので、
  # このグループに入るのは main の run だけである。
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.tip.outputs.current == 'true'
    needs: [build, teeth, tip]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
